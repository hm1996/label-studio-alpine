apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: labelstudio-pipeline
spec:
  workspaces:
    - name: shared-repository
      description: | 
        This workspace contains the cloned repo files, so they can be read by the
        next task.
    - name: helm-shared-repository
      description: | 
        This workspace contains the cloned repo files, so they can be read by the
        next task.
    - name: git-credentials
      description: SSH credentials from secret
  params:
    - name: NODE_VERSION
      type: string
      default: "18"
    - name: PYTHON_VERSION
      type: string
      default: "3.11"
    - name: POETRY_VERSION
      type: string
      default: "1.8.4"
    - name: VERSION_OVERRIDE
      type: string
      default: ""
    - name: BRANCH_OVERRIDE
      type: string
      default: ""
    - name: GITHUB_REPO_URL
      type: string
      default: ""
    - name: SOURCE_REVISION
      type: string
      default: develop
    - name: REGISTRY_URL
      type: string
      default: registry.kube-system.svc.cluster.local:80
    - name: WEB_IMAGE_NAME
      type: string
      default: label-studio-web
    - name: APP_IMAGE_NAME
      type: string
      default: label-studio-app
    - name: VERSION
      type: string
      default: "1.15.0" # TODO: Find a way to do this dynamic
  tasks:
    - name: regression-tests
      params:
        - name: LABEL_STUDIO_URL
          value: http://label-studio-test-ls-web.label-studio-test.svc.cluster.local
        - name: HELM_RELEASE
          value: label-studio-test
        - name: HELM_RELEASE_NAMESPACE
          value: label-studio-test
        - name: LABEL_STUDIO_APP_NAME
          value: ls-app
        - name: KUBE_CONFIG_PATH
          value: ''
        - name: MINIO_URL
          value: minio-1737413701.minio.svc.cluster.local:9000
        - name: MINIO_EXTERNAL_URL
          value: http://minio-1737413701.minio.svc.cluster.local:9000
        - name: MINIO_BUCKET
          value: label-studio-test
        - name: MINIO_KEY_ID
          value: yPHcPxXxbruCjhQNM9O7
        - name: MINIO_SECRET_KEY
          value: miYc42jQTCc7Sdk540yYLDm9uJdwl3ks8y4cE9Lt
      taskSpec:
        params:
          - name: LABEL_STUDIO_URL
            default: http://localhost:8085
          - name: HELM_RELEASE
            default: label-studio
          - name: HELM_RELEASE_NAMESPACE
            default: default
          - name: LABEL_STUDIO_APP_NAME
            default: ls-app
          - name: KUBE_CONFIG_PATH
            default: ''
          - name: MINIO_URL
            default: ''
          - name: MINIO_EXTERNAL_URL
            default: ''
          - name: MINIO_BUCKET
            default: ''
          - name: MINIO_KEY_ID
            default: ''
          - name: MINIO_SECRET_KEY
            default: ''
        steps:
          - name: regression-tests
            image: 10.101.123.76:80/label-studio-test:latest
            env:
              - name: LABEL_STUDIO_URL
                value: $(params.LABEL_STUDIO_URL)
              - name: HELM_RELEASE
                value: $(params.HELM_RELEASE)
              - name: HELM_RELEASE_NAMESPACE
                value: $(params.HELM_RELEASE_NAMESPACE)
              - name: LABEL_STUDIO_APP_NAME
                value: $(params.LABEL_STUDIO_APP_NAME)
              - name: KUBE_CONFIG_PATH
                value: $(params.KUBE_CONFIG_PATH)
              - name: MINIO_URL
                value: $(params.MINIO_URL)
              - name: MINIO_EXTERNAL_URL
                value: $(params.MINIO_EXTERNAL_URL)
              - name: MINIO_BUCKET
                value: $(params.MINIO_BUCKET)
              - name: MINIO_KEY_ID
                value: $(params.MINIO_KEY_ID)
              - name: MINIO_SECRET_KEY
                value: $(params.MINIO_SECRET_KEY)
        